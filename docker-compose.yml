services:
  container-cpu:
    build:
      context: .
      args:
        BASE_IMAGE: python:3.12-slim
        INSTALL_GIT: "true"
        INSTALL_TORCH: "true"
    volumes:
      - .:/app
    command: sleep infinity

  container-gpu:
    build:
      context: .
      args:
        BASE_IMAGE: nvcr.io/nvidia/pytorch:25.08-py3
        INSTALL_TORCH: "false"
    volumes:
      - .:/app
    command: sleep infinity
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
